[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lazy-recall"
version = "0.3.1"
description = "Global decision-risk KV management with lazy eviction and CPU recall"
requires-python = ">=3.10"
dependencies = ["torch==2.11.0", "transformers==5.14.1", "numpy>=1.26,<3", "accelerate>=1.0", "safetensors"]

[project.optional-dependencies]
recall = ["faiss-cpu>=1.8"]
test = ["pytest>=8"]

[project.scripts]
lazy-recall = "lazy_recall.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tool/tests"]
pythonpath = ["src"]
